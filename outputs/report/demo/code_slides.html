<script>
const SLIDES = [{"title": "① classify_car：视觉识别确实由工具真实调用模型", "say": "这是 classify_car 的实现。它不走任何捷径，而是加载集成权重做真实前向推理。", "points": ["真实加载 outputs/checkpoints 下的三模型集成权重", "第 151 行 clf.predict_path() 是真正的前向推理调用", "模型不可用时抛 MODEL_NOT_LOADED，绝不返回伪造结果"], "file": "agent/tools/vision.py", "start_line": 126, "html": "<span class=\"kw\">def</span> _handler(args: dict, ctx: ToolContext) -&gt; dict:\n    cfg = ctx.config\n    ctx.check_abort()\n\n    image_path = args.get(<span class=\"st\">&quot;image_path&quot;</span>) <span class=\"kw\">or</span> ctx.image_path\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> image_path:\n        <span class=\"kw\">raise</span> ToolError(\n            Code.DEPENDENCY_MISSING,\n            <span class=\"st\">&quot;没有可用的图片&quot;</span>,\n            hint=<span class=\"st\">&quot;用户还没有上传图片。请先请用户上传一张车辆照片，再调用本工具。&quot;</span>,\n        )\n\n    p = Path(image_path)\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> p.is_absolute():\n        p = cfg.project_root / p\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> p.exists():\n        <span class=\"kw\">raise</span> ToolError(Code.IMAGE_NOT_FOUND, f<span class=\"st\">&quot;图片不存在：{p}&quot;</span>,\n                        hint=<span class=\"st\">&quot;请确认图片已上传成功，或重新上传&quot;</span>)\n\n    clf = get_classifier(cfg)\n    ctx.check_abort()\n\n    <span class=\"kw\">try</span>:\n        <span class=\"cm\"># 多要一位：下面会把 unknown 那一行滤掉，所以按 top_k+1 取，</span>\n        <span class=\"cm\"># 保证返回给模型的永远是 top_k 个**真实车型**候选。</span>\n        res = clf.predict_path(p, top_k=int(args.get(<span class=\"st\">&quot;top_k&quot;</span>) <span class=\"kw\">or</span> cfg.top_k) + <span class=\"nm\">1</span>)\n    <span class=\"kw\">except</span> ToolError:\n        <span class=\"kw\">raise</span>\n    <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span> e:                <span class=\"cm\"># noqa: BLE001</span>\n        <span class=\"kw\">raise</span> ToolError(Code.IMAGE_UNREADABLE, f<span class=\"st\">&quot;图片读取或推理失败：{type(e).__name__}: {e}&quot;</span>,\n                        hint=<span class=\"st\">&quot;请确认文件是有效的图片格式（jpg/png），或重新上传&quot;</span>) <span class=\"kw\">from</span> e\n\n    conf = float(res[<span class=\"st\">&quot;confidence&quot;</span>])\n    is_unknown = bool(res[<span class=\"st\">&quot;is_unknown&quot;</span>])\n    want_k = int(args.get(<span class=\"st\">&quot;top_k&quot;</span>) <span class=\"kw\">or</span> cfg.top_k)\n    <span class=\"cm\"># unknown 不是一个&quot;候选车型&quot;，它是&quot;以上都不是&quot;这个结论本身，</span>\n    <span class=\"cm\"># 因此不放进 top_candidates —— 低置信度时让用户确认的是具体车型。</span>\n    top = [\n        {\n            <span class=\"st\">&quot;car_id&quot;</span>: t[<span class=\"st\">&quot;label_id&quot;</span>],\n            <span class=\"st\">&quot;car_name&quot;</span>: t[<span class=\"st\">&quot;label_name&quot;</span>],\n            <span class=\"st\">&quot;confidence&quot;</span>: round(float(t[<span class=\"st\">&quot;probability&quot;</span>]), <span class=\"nm\">6</span>),\n        }\n        <span class=\"kw\">for</span> t <span class=\"kw\">in</span> res.get(<span class=\"st\">&quot;top_k&quot;</span>, [])\n        <span class=\"kw\">if</span> t.get(<span class=\"st\">&quot;label_id&quot;</span>) != <span class=\"st\">&quot;unknown&quot;</span>\n    ][:want_k]\n\n    <span class=\"kw\">return</span> {\n        <span class=\"st\">&quot;ok&quot;</span>: <span class=\"kw\">True</span>,\n        <span class=\"st\">&quot;car_id&quot;</span>: res[<span class=\"st\">&quot;label_id&quot;</span>],\n        <span class=\"st\">&quot;car_name&quot;</span>: res[<span class=\"st\">&quot;label_name&quot;</span>],\n        <span class=\"st\">&quot;confidence&quot;</span>: round(conf, <span class=\"nm\">6</span>),\n        <span class=\"st\">&quot;is_unknown&quot;</span>: is_unknown,\n        <span class=\"st\">&quot;low_confidence&quot;</span>: (<span class=\"kw\">not</span> is_unknown) <span class=\"kw\">and</span> conf &lt; cfg.display_confidence_threshold,\n        <span class=\"st\">&quot;top_candidates&quot;</span>: top,\n        <span class=\"st\">&quot;image&quot;</span>: {<span class=\"st\">&quot;path&quot;</span>: str(p), <span class=\"st\">&quot;file_name&quot;</span>: p.name},\n        <span class=\"st\">&quot;model&quot;</span>: {\n            <span class=\"st\">&quot;name&quot;</span>: model_label(cfg),\n            <span class=\"st\">&quot;tta_hflip&quot;</span>: cfg.vision_tta,\n            <span class=\"st\">&quot;prior_adjust_tau&quot;</span>: cfg.prior_adjust_tau,\n            <span class=\"st\">&quot;unknown_threshold&quot;</span>: cfg.unknown_threshold,\n            <span class=\"st\">&quot;display_confidence_threshold&quot;</span>: cfg.display_confidence_threshold,\n        },\n        <span class=\"st\">&quot;decision&quot;</span>: _decide(is_unknown, conf, cfg),\n        <span class=\"st\">&quot;note&quot;</span>: (\n            <span class=\"st\">&quot;confidence 是 softmax 最大概率，且已应用先验校正（τ）与拒识阈值（t），&quot;</span>\n            <span class=\"st\">&quot;两者均由验证集扫描确定；阈值推导见 outputs/reports/final_model_choice.json &quot;</span>\n            <span class=\"st\">&quot;与 agent/data/confidence_threshold.json&quot;</span>\n        ),\n    }\n\n\nVISION_TOOLS: list[ToolDefinition] = [\n    ToolDefinition(\n        name=<span class=\"st\">&quot;classify_car&quot;</span>,\n        description=(\n            <span class=\"st\">&quot;识别图片中的车型。真实加载并调用本组自训练的视觉分类模型，&quot;</span>\n            <span class=\"st\">&quot;返回 50 款目标车型之一的四位类别 ID、车型名称与置信度；&quot;</span>\n            <span class=\"st\">&quot;若判定不属于这 50 款，则返回 car_id=\\&quot;</span>unknown\\<span class=\"st\">&quot;。&quot;</span>\n            <span class=\"st\">&quot;当用户上传了车辆照片并要求识别、或后续操作需要知道车型时调用本工具。&quot;</span>\n            <span class=\"st\">&quot;本工具只接受文本参数，图片由用户在 Web 界面上传，会话中已绑定最近一次上传的图片。&quot;</span>\n        ),\n        parameters={\n            <span class=\"st\">&quot;type&quot;</span>: <span class=\"st\">&quot;object&quot;</span>,\n            <span class=\"st\">&quot;properties&quot;</span>: {\n                <span class=\"st\">&quot;image_path&quot;</span>: {"}, {"title": "② 集成打分：三个模型 + 先验校正的唯一入口", "say": "三个模型各自出 logits，先做先验校正，再按权重融合。训练和工具共用这一份实现。", "points": ["先验校正系数 τ 由验证集网格搜索得到（最终 0.2）", "训练评估与线上工具调用共用同一份打分逻辑，避免口径漂移"], "file": "src/cardex/inference.py", "start_line": 301, "html": "    <span class=\"kw\">def</span> score_logits(self, images: list[Image.Image],\n                     batch_size: int = <span class=\"nm\">32</span>) -&gt; torch.Tensor:\n        <span class=\"st\">&quot;&quot;&quot;集成的**打分本体**：返回 (N, 51) 的 logits，已做权重融合与先验校正。\n\n        这是**唯一**的打分入口 —— `predict_batch` 和&quot;导出 logits 做提交&quot;都走它。\n        之所以抽出来：项目早期踩过&quot;实验脚本自己实现一遍打分、结果和线上差 0.012&quot;的坑。\n        打分口径必须只有一份实现。\n\n        返回的是 logits（softmax 之前的分数），与教师要求的 `result.npz` 一致：\n        可以取负、不要求和为 1；`argmax` 即最终预测（阈值 t=0 时无额外拒识）。\n        &quot;&quot;&quot;</span>\n        wsum = float(sum(self.weights))\n        acc = <span class=\"kw\">None</span>\n        <span class=\"cm\"># 每批再切成 batch_size 的小块：多裁剪模式下一次前向的实际张量数是</span>\n        <span class=\"cm\"># batch_size × 视角数（默认 10），不切块在大分辨率下会爆显存。</span>\n        step = max(<span class=\"nm\">1</span>, batch_size)\n        <span class=\"kw\">for</span> s <span class=\"kw\">in</span> range(<span class=\"nm\">0</span>, len(images), step):\n            chunk = images[s : s + step]\n            acc_c = <span class=\"kw\">None</span>\n            <span class=\"kw\">for</span> member, w <span class=\"kw\">in</span> zip(self.members, self.weights):\n                logits = member.tta_logits(chunk)          <span class=\"cm\"># 已按 tta_mode 平均好</span>\n                <span class=\"kw\">if</span> self.log_prior <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n                    logits = logits - self.prior_adjust_tau * self.log_prior.to(logits.device)[<span class=\"kw\">None</span>, :]\n                term = logits * (w / wsum)\n                acc_c = term <span class=\"kw\">if</span> acc_c <span class=\"kw\">is</span> <span class=\"kw\">None</span> <span class=\"kw\">else</span> acc_c + term\n            acc = acc_c <span class=\"kw\">if</span> acc <span class=\"kw\">is</span> <span class=\"kw\">None</span> <span class=\"kw\">else</span> torch.cat([acc, acc_c], dim=<span class=\"nm\">0</span>)\n        <span class=\"kw\">return</span> acc\n\n    @torch.no_grad()\n    <span class=\"kw\">def</span> predict_batch(self, images: list[Image.Image], batch_size: int = <span class=\"nm\">32</span>,\n                      top_k: int | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>) -&gt; list[dict]:\n        acc = self.score_logits(images, batch_size=batch_size)\n        probs = torch.softmax(acc, dim=<span class=\"nm\">1</span>)\n        conf, idx = probs.max(dim=<span class=\"nm\">1</span>)\n        <span class=\"kw\">if</span> self.unknown_threshold &gt; <span class=\"nm\">0</span>:\n            idx = torch.where(conf &lt; self.unknown_threshold,\n                              torch.full_like(idx, self.unknown_index), idx)\n\n        <span class=\"cm\"># Top-K 候选（按**校正后的集成概率**排序）。</span>\n        <span class=\"cm\"># 注意：拒识时 idx 被改写成 unknown，但 top_k 仍然列出真实候选——</span>\n        <span class=\"cm\"># 这正是「拒识 + 给用户几个参考项」所需要的信息。</span>\n        order = <span class=\"kw\">None</span>\n        <span class=\"kw\">if</span> top_k:\n            order = torch.argsort(probs, descending=<span class=\"kw\">True</span>, dim=<span class=\"nm\">1</span>)[:, : int(top_k)]\n\n        out: list[dict] = []\n        <span class=\"kw\">for</span> j <span class=\"kw\">in</span> range(len(images)):\n            item = {\n                <span class=\"st\">&quot;label_id&quot;</span>: self.label_ids[int(idx[j])],\n                <span class=\"st\">&quot;label_name&quot;</span>: self.label_names[int(idx[j])],\n                <span class=\"st\">&quot;index&quot;</span>: int(idx[j]),\n                <span class=\"st\">&quot;confidence&quot;</span>: float(conf[j]),\n                <span class=\"st\">&quot;is_unknown&quot;</span>: int(idx[j]) == self.unknown_index,\n            }\n            <span class=\"kw\">if</span> order <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n                item[<span class=\"st\">&quot;top_k&quot;</span>] = [\n                    {\n                        <span class=\"st\">&quot;label_id&quot;</span>: self.label_ids[int(i)],\n                        <span class=\"st\">&quot;label_name&quot;</span>: self.label_names[int(i)],\n                        <span class=\"st\">&quot;index&quot;</span>: int(i),\n                        <span class=\"st\">&quot;probability&quot;</span>: float(probs[j, int(i)]),\n                    }\n                    <span class=\"kw\">for</span> i <span class=\"kw\">in</span> order[j]\n                ]"}, {"title": "③ 智能体循环：模型决策 → 执行工具 → 结果回传", "say": "每一轮把工具结果回传给模型，由模型决定下一步调哪个工具，循环直到给出最终回答。", "points": ["工具在独立线程执行，超时与异常都被结构化捕获", "每步的输入、输出、耗时写入 tool_calls.jsonl，可逐条复核"], "file": "agent/loop.py", "start_line": 269, "html": "    <span class=\"kw\">def</span> run_turn(self, session: Session, user_text: str,\n                 image_path: str | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>,\n                 on_event: EventCallback | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>) -&gt; TurnResult:\n        turn_id = f<span class=\"st\">&quot;t-{uuid.uuid4().hex[:8]}&quot;</span>\n        t0 = time.perf_counter()\n        cfg = self.config\n        records: list[ToolCallRecord] = []\n\n        <span class=\"kw\">def</span> emit(kind: str, **payload: Any) -&gt; <span class=\"kw\">None</span>:\n            <span class=\"kw\">if</span> on_event <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n                <span class=\"kw\">return</span>\n            <span class=\"kw\">try</span>:\n                on_event({<span class=\"st\">&quot;type&quot;</span>: kind, <span class=\"st\">&quot;turn_id&quot;</span>: turn_id, **payload})\n            <span class=\"kw\">except</span> Exception:\n                <span class=\"kw\">pass</span>\n\n        session.add_user(user_text, image_path)\n        session.turns += <span class=\"nm\">1</span>\n\n        <span class=\"cm\"># turn 快照：本轮生效的策略与资源（对标 Codex 的 turn_context）</span>\n        snapshot = {\n            <span class=\"st\">&quot;turn_id&quot;</span>: turn_id,\n            <span class=\"st\">&quot;index&quot;</span>: session.turns,\n            <span class=\"st\">&quot;image&quot;</span>: _name_of(image_path <span class=\"kw\">or</span> session.image_path),\n            <span class=\"st\">&quot;unknown_threshold&quot;</span>: cfg.unknown_threshold,\n            <span class=\"st\">&quot;display_confidence_threshold&quot;</span>: cfg.display_confidence_threshold,\n            <span class=\"st\">&quot;vision_model&quot;</span>: [p.parent.name <span class=\"kw\">for</span> p <span class=\"kw\">in</span> cfg.checkpoint_paths() <span class=\"kw\">if</span> p.exists()],\n            <span class=\"st\">&quot;tools&quot;</span>: self.registry.names(),\n            <span class=\"st\">&quot;offline&quot;</span>: bool(cfg.offline),\n            <span class=\"st\">&quot;max_rounds&quot;</span>: cfg.max_rounds,\n        }\n        session.append_event(<span class=\"st\">&quot;turn_context&quot;</span>, snapshot)\n        emit(<span class=\"st\">&quot;turn_start&quot;</span>, turn=snapshot, user_text=user_text)\n\n        reply, rounds, usage = <span class=\"st\">&quot;&quot;</span>, <span class=\"nm\">0</span>, {}\n        ok, err_code, err_msg = <span class=\"kw\">True</span>, <span class=\"st\">&quot;&quot;</span>, <span class=\"st\">&quot;&quot;</span>\n        err_info: dict = {}\n        self._last_rounds = <span class=\"nm\">0</span>\n\n        <span class=\"kw\">with</span> self._lock_for(session.session_id):\n            <span class=\"kw\">try</span>:\n                reply, rounds, usage = self._run_steps(session, turn_id, records, emit)\n            <span class=\"kw\">except</span> AgentError <span class=\"kw\">as</span> e:\n                ok, err_code, err_msg = <span class=\"kw\">False</span>, e.code, e.message\n                err_info = dict(e.info <span class=\"kw\">or</span> {})\n                rounds = self._last_rounds\n                session.append_event(<span class=\"st\">&quot;error&quot;</span>, {<span class=\"st\">&quot;turn_id&quot;</span>: turn_id, <span class=\"st\">&quot;code&quot;</span>: e.code,\n                                               <span class=\"st\">&quot;message&quot;</span>: e.message, <span class=\"st\">&quot;info&quot;</span>: e.info})\n                emit(<span class=\"st\">&quot;error&quot;</span>, code=e.code, message=e.message, info=e.info)\n            <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span> e:                        <span class=\"cm\"># noqa: BLE001</span>\n                ok, err_code, err_msg = <span class=\"kw\">False</span>, <span class=\"st\">&quot;INTERNAL_ERROR&quot;</span>, f<span class=\"st\">&quot;{type(e).__name__}: {e}&quot;</span>\n                rounds = self._last_rounds\n                session.append_event(<span class=\"st\">&quot;error&quot;</span>, {<span class=\"st\">&quot;turn_id&quot;</span>: turn_id, <span class=\"st\">&quot;code&quot;</span>: err_code,\n                                               <span class=\"st\">&quot;message&quot;</span>: err_msg})\n                emit(<span class=\"st\">&quot;error&quot;</span>, code=err_code, message=err_msg)\n\n        elapsed = round((time.perf_counter() - t0) * <span class=\"nm\">1000</span>, <span class=\"nm\">1</span>)\n        session.append_event(<span class=\"st\">&quot;turn_end&quot;</span>, {\n            <span class=\"st\">&quot;turn_id&quot;</span>: turn_id, <span class=\"st\">&quot;turn_index&quot;</span>: session.turns, <span class=\"st\">&quot;ok&quot;</span>: ok, <span class=\"st\">&quot;reply&quot;</span>: reply,\n            <span class=\"st\">&quot;rounds&quot;</span>: rounds, <span class=\"st\">&quot;elapsed_ms&quot;</span>: elapsed,\n            <span class=\"st\">&quot;tool_calls&quot;</span>: [r.brief() <span class=\"kw\">for</span> r <span class=\"kw\">in</span> records],\n            <span class=\"st\">&quot;tools_used&quot;</span>: [r.name <span class=\"kw\">for</span> r <span class=\"kw\">in</span> records],\n        })\n        emit(<span class=\"st\">&quot;turn_end&quot;</span>, ok=ok, reply=reply, rounds=rounds, elapsed_ms=elapsed,\n             tool_calls=len(records))\n\n        <span class=\"kw\">return</span> TurnResult(\n            turn_id=turn_id, reply=reply, tool_calls=records, rounds=rounds,\n            elapsed_ms=elapsed, ok=ok, error_code=err_code, error_message=err_msg,\n            error_info=err_info, simulated=self.is_offline, usage=usage,\n        )\n\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>"}, {"title": "④ 工具注册表：12 个工具与其 JSON Schema", "say": "十二个工具集中注册，参数用 JSON Schema 校验，模型只能在这张表里选工具。", "points": ["1 个视觉工具 + 11 个业务工具，共 12 个", "非法参数在进入工具前就被拦下，返回 INVALID_ARGUMENT", "工具名不在注册表内直接报错，不会静默忽略"], "file": "agent/tools/registry.py", "start_line": 108, "html": "<span class=\"kw\">class</span> ToolRegistry:\n    <span class=\"st\">&quot;&quot;&quot;工具注册表 + 执行器。&quot;&quot;&quot;</span>\n\n    <span class=\"kw\">def</span> __init__(self) -&gt; <span class=\"kw\">None</span>:\n        self._tools: dict[str, ToolDefinition] = {}\n        self._gates: list[Callable[[ToolDefinition, dict, ToolContext], str | <span class=\"kw\">None</span>]] = []\n        self._post: list[Callable[[ToolDefinition, ToolResult, ToolContext], <span class=\"kw\">None</span>]] = []\n        self._log_path: Path | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>\n        self._log_lock = threading.Lock()\n\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"cm\"># 注册与查询</span>\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"kw\">def</span> register(self, definition: ToolDefinition) -&gt; <span class=\"kw\">None</span>:\n        <span class=\"kw\">if</span> definition.name <span class=\"kw\">in</span> self._tools:\n            <span class=\"kw\">raise</span> ValueError(f<span class=\"st\">&quot;工具名重复：{definition.name}&quot;</span>)\n        self._tools[definition.name] = definition\n\n    <span class=\"kw\">def</span> get(self, name: str) -&gt; ToolDefinition | <span class=\"kw\">None</span>:\n        <span class=\"kw\">return</span> self._tools.get(name)\n\n    <span class=\"kw\">def</span> names(self) -&gt; list[str]:\n        <span class=\"kw\">return</span> list(self._tools)\n\n    <span class=\"kw\">def</span> all(self) -&gt; list[ToolDefinition]:\n        <span class=\"kw\">return</span> list(self._tools.values())\n\n    <span class=\"kw\">def</span> schemas(self) -&gt; list[dict]:\n        <span class=\"kw\">return</span> [t.to_openai_schema() <span class=\"kw\">for</span> t <span class=\"kw\">in</span> self._tools.values()]\n\n    <span class=\"kw\">def</span> describe(self) -&gt; list[dict]:\n        <span class=\"st\">&quot;&quot;&quot;给 UI / 报告用的工具清单。&quot;&quot;&quot;</span>\n        <span class=\"kw\">return</span> [\n            {\n                <span class=\"st\">&quot;name&quot;</span>: t.name,\n                <span class=\"st\">&quot;description&quot;</span>: t.description,\n                <span class=\"st\">&quot;parameters&quot;</span>: t.parameters,\n                <span class=\"st\">&quot;timeout_s&quot;</span>: t.timeout_s,\n                <span class=\"st\">&quot;requires_image&quot;</span>: t.requires_image,\n                <span class=\"st\">&quot;tags&quot;</span>: list(t.tags),\n            }\n            <span class=\"kw\">for</span> t <span class=\"kw\">in</span> self._tools.values()\n        ]\n\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"cm\"># 钩子</span>\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"kw\">def</span> add_gate(self, fn: Callable[[ToolDefinition, dict, ToolContext], str | <span class=\"kw\">None</span>]) -&gt; <span class=\"kw\">None</span>:\n        <span class=\"st\">&quot;&quot;&quot;前置门禁：返回字符串表示拒绝（字符串即拒绝理由），返回 None 表示放行。&quot;&quot;&quot;</span>\n        self._gates.append(fn)\n\n    <span class=\"kw\">def</span> add_post(self, fn: Callable[[ToolDefinition, ToolResult, ToolContext], <span class=\"kw\">None</span>]) -&gt; <span class=\"kw\">None</span>:\n        <span class=\"st\">&quot;&quot;&quot;后置处理：可以观察或就地修改 ToolResult。&quot;&quot;&quot;</span>\n        self._post.append(fn)\n\n    <span class=\"kw\">def</span> enable_log(self, path: Path) -&gt; <span class=\"kw\">None</span>:\n        <span class=\"st\">&quot;&quot;&quot;启用工具调用记录（JSONL，每行一次调用）。&quot;&quot;&quot;</span>\n        path.parent.mkdir(parents=<span class=\"kw\">True</span>, exist_ok=<span class=\"kw\">True</span>)\n        self._log_path = path\n\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"cm\"># 执行</span>\n    <span class=\"cm\"># ------------------------------------------------------------------ #</span>\n    <span class=\"kw\">def</span> execute(self, call_id: str, name: str, raw_arguments: str | dict,\n                ctx: ToolContext, timeout_s: float | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>) -&gt; ToolResult:\n        t0 = time.perf_counter()\n\n        <span class=\"kw\">def</span> done(payload: dict, ok: bool, code: str = <span class=\"st\">&quot;&quot;</span>) -&gt; ToolResult:\n            res = ToolResult(\n                call_id=call_id, name=name, ok=ok, payload=payload,\n                elapsed_ms=round((time.perf_counter() - t0) * <span class=\"nm\">1000</span>, <span class=\"nm\">2</span>), code=code,\n            )"}, {"title": "⑤ 评分口径：51 类 Macro-F1（含 unknown）", "say": "评分口径严格对齐教师要求：五十一类等权 Macro-F1，unknown 作为第五十一类参与计算。", "points": ["51 类等权，unknown 与 50 个已知类权重完全相同", "与教师评测口径一致，本地分数可直接对照线上得分"], "file": "src/cardex/metrics.py", "start_line": 25, "html": "<span class=\"kw\">def</span> compute_metrics(y_true: np.ndarray, y_pred: np.ndarray, label_names: list[str]) -&gt; dict:\n    <span class=\"st\">&quot;&quot;&quot;按任务书 4.3 节口径计算指标。\n\n    评分指标：51 类 Macro-F1（等权平均，分母为 0 的类别 F1 记 0）。\n    辅助指标：Accuracy、每类 P/R/F1、混淆矩阵、unknown 检出率、已知类误拒率。\n    &quot;&quot;&quot;</span>\n    y_true = np.asarray(y_true)\n    y_pred = np.asarray(y_pred)\n    n_classes = len(label_names)\n    unknown_index = n_classes - <span class=\"nm\">1</span>\n\n    labels = list(range(n_classes))\n    macro_f1 = float(f1_score(y_true, y_pred, labels=labels, average=<span class=\"st\">&quot;macro&quot;</span>, zero_division=<span class=\"nm\">0</span>))\n    accuracy = float(accuracy_score(y_true, y_pred))\n\n    precision, recall, f1, support = precision_recall_fscore_support(\n        y_true, y_pred, labels=labels, zero_division=<span class=\"nm\">0</span>\n    )\n    cm = confusion_matrix(y_true, y_pred, labels=labels)\n\n    <span class=\"cm\"># unknown 检出率：真实 unknown 中被正确判为 unknown 的比例。</span>\n    <span class=\"cm\"># ⚠️ 用自定义小数据集微调时，验证集里**可能一个 unknown 样本都没有** ——</span>\n    <span class=\"cm\"># 那种情况下这个指标是&quot;无定义&quot;，返回 None 让调用方显示成 `—`，</span>\n    <span class=\"cm\"># 而不是 NaN（NaN 会污染日志、也会让下游的排序/比较莫名其妙地失效）。</span>\n    unk_true = y_true == unknown_index\n    unknown_detection_rate = (\n        float((y_pred[unk_true] == unknown_index).mean()) <span class=\"kw\">if</span> unk_true.any() <span class=\"kw\">else</span> <span class=\"kw\">None</span>\n    )\n    <span class=\"cm\"># 已知类误拒率：真实已知类中被误判为 unknown 的比例</span>\n    known_true = ~unk_true\n    known_false_reject_rate = (\n        float((y_pred[known_true] == unknown_index).mean()) <span class=\"kw\">if</span> known_true.any() <span class=\"kw\">else</span> <span class=\"kw\">None</span>\n    )\n\n    per_class = []\n    <span class=\"kw\">for</span> i, name <span class=\"kw\">in</span> enumerate(label_names):\n        per_class.append(\n            {\n                <span class=\"st\">&quot;index&quot;</span>: i,\n                <span class=\"st\">&quot;label&quot;</span>: name,\n                <span class=\"st\">&quot;precision&quot;</span>: float(precision[i]),\n                <span class=\"st\">&quot;recall&quot;</span>: float(recall[i]),\n                <span class=\"st\">&quot;f1&quot;</span>: float(f1[i]),\n                <span class=\"st\">&quot;support&quot;</span>: int(support[i]),\n            }\n        )\n\n    <span class=\"kw\">return</span> {\n        <span class=\"st\">&quot;macro_f1&quot;</span>: macro_f1,\n        <span class=\"st\">&quot;accuracy&quot;</span>: accuracy,\n        <span class=\"st\">&quot;unknown_detection_rate&quot;</span>: unknown_detection_rate,\n        <span class=\"st\">&quot;known_false_reject_rate&quot;</span>: known_false_reject_rate,\n        <span class=\"st\">&quot;per_class&quot;</span>: per_class,\n        <span class=\"st\">&quot;confusion_matrix&quot;</span>: cm.tolist(),\n        <span class=\"st\">&quot;report_text&quot;</span>: classification_report(\n            y_true, y_pred, labels=labels, target_names=label_names, zero_division=<span class=\"nm\">0</span>, digits=<span class=\"nm\">3</span>\n        ),\n        <span class=\"st\">&quot;n_samples&quot;</span>: int(len(y_true)),\n    }\n\n"}];
let cur = -1, raf = null, paused = false, y = 0, speed = 0.55, last = 0;

function render(i) {
  cur = i; const s = SLIDES[i];
  document.getElementById('title').textContent = s.title;
  document.getElementById('file').textContent = s.file + ' : 第 ' + s.start_line + ' 行起';
  document.getElementById('points').innerHTML =
    s.points.map(p => '<li>' + p + '</li>').join('');
  const rows = s.html.split('\n').map((l, k) =>
    '<tr><td class="ln">' + (s.start_line + k) + '</td><td class="src">' + (l || ' ') + '</td></tr>');
  document.getElementById('tb').innerHTML = rows.join('');
  document.getElementById('say').textContent = s.say;
  y = 0; paused = false;
  document.getElementById('inner').style.transform = 'translateY(0px)';
}

function tick(ts) {
  if (!last) last = ts;
  const dt = (ts - last) / 1000; last = ts;
  if (!paused) {
    const area = document.getElementById('code');
    const inner = document.getElementById('inner');
    const max = Math.max(0, inner.scrollHeight - area.clientHeight + 90);
    y = Math.min(max, y + speed * 60 * dt);
    inner.style.transform = 'translateY(' + (-y) + 'px)';
  }
  raf = requestAnimationFrame(tick);
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') render((cur + 1) % SLIDES.length);
  else if (e.key === 'ArrowLeft')  render((cur - 1 + SLIDES.length) % SLIDES.length);
  else if (e.key === ' ') { e.preventDefault(); paused = !paused; }
  else if (e.key === 'ArrowDown') { paused = true; y += 90;
        document.getElementById('inner').style.transform = 'translateY(' + (-y) + 'px)'; }
  else if (e.key === 'ArrowUp') { paused = true; y = Math.max(0, y - 90);
        document.getElementById('inner').style.transform = 'translateY(' + (-y) + 'px)'; }
  else if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen();
  else if (e.key.toLowerCase() === 'r') render(cur);
});

document.getElementById('prog').textContent = SLIDES.length + ' 段代码';
render(0); requestAnimationFrame(tick);
</script></body></html>
